{# A labelled <select>. `label` is the help text; `flag` is the CLI flag shown
   after it; `options` have `value` and `label`; the option equal to `selected`
   is pre-selected. #}
{% macro select_field(name, label, flag, options, selected, required=true) %}
<label for="{{ name }}">{{ label }} <span class="arg-flag">({{ flag }})</span></label>
<select name="{{ name }}" id="{{ name }}"{% if required %} required{% endif %}>
  {% for option in options %}
    <option value="{{ option.value }}" {% if selected == option.value %}selected{% endif %}>{{ option.label }}</option>
  {% endfor %}
</select>
{% endmacro %}
