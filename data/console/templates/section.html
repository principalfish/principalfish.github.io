{% extends "base.html" %}
{% block content %}
  <section class="hero">
    <h1>{{ section.label }}</h1>
    <p>Everything the console does for {{ section.label }}.</p>
  </section>

  <section class="card">
    <div class="action-stack">
      {% for item in nav.section_items %}
        <a class="button{% if item.primary %} primary{% endif %} button-block" href="{{ item.url }}">{{ item.label }}</a>
      {% endfor %}
      {% if extra %}{% include extra %}{% endif %}
    </div>
  </section>
{% endblock %}
