services:
  db:
    image: postgis/postgis:16-3.4
    container_name: election_maps_db
    environment:
      POSTGRES_DB: election_maps
      POSTGRES_USER: election_maps
      POSTGRES_PASSWORD: election_maps_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
