[mypy]
strict = True
python_version = 3.12
files = .
# archive/ is a record of finished one-offs and is never type-checked. The US TopoJSON
# builders are one-shot map scripts and are excluded by name.
exclude = ^(election_data|\.venv|venv|env|archive)/|^importers/results/us/geometry/build_[a-z]+_topojson\.py$
explicit_package_bases = True

plugins = sqlalchemy.ext.mypy.plugin

# Flask's route decorator binds the view function against RouteCallable
# (Callable[..., ResponseReturnValue]); strict mypy mis-reports a [type-var]
# error on every @bp.route view annotated with the broad ResponseReturnValue.
# This is a known Flask + mypy-strict artifact, not a real typing problem. Each
# package that holds route files gets its own section; there is no blanket
# console.* section, so console.shared (no routes) is checked without the exemption.
[mypy-console.home]
disable_error_code = type-var

[mypy-console.admin.*]
disable_error_code = type-var

[mypy-console.holyrood.*]
disable_error_code = type-var

[mypy-console.polls.*]
disable_error_code = type-var

[mypy-console.us.*]
disable_error_code = type-var

[mypy-console.westminster.*]
disable_error_code = type-var

# The US section views register their per-chamber routes via bp.add_url_rule, where
# the same stub artifact surfaces as [arg-type] on view_func instead of [type-var].
# (This specific section replaces the glob's option, so type-var is repeated.)
[mypy-console.us.views]
disable_error_code = type-var, arg-type

# Third-party packages without type stubs
[mypy-pypdf.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-xlrd.*]
ignore_missing_imports = True

[mypy-shapely.*]
ignore_missing_imports = True

[mypy-lxml.*]
ignore_missing_imports = True
