[mypy]
strict = True
python_version = 3.10
files = ., models.py
exclude = ^(election_data|\.venv|venv|env)/
explicit_package_bases = True
mypy_path = scripts

plugins = sqlalchemy.ext.mypy.plugin

# Third-party packages without type stubs
[mypy-pypdf.*]
ignore_missing_imports = True

[mypy-geoalchemy2.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-xlrd.*]
ignore_missing_imports = True

[mypy-shapely.*]
ignore_missing_imports = True

[mypy-psycopg2.*]
ignore_missing_imports = True

[mypy-lxml.*]
ignore_missing_imports = True

[mypy-run_uns_model]
ignore_missing_imports = True

[mypy-export_non_simulation_elections]
ignore_missing_imports = True
