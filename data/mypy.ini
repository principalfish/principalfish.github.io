[mypy]
strict = True
python_version = 3.12
files = ., models.py
# old_data/ holds seed importers run by scripts/rebuild_database.py (type-checked),
# plus archive-only and one-shot scripts (excluded by name).
exclude = ^(election_data|\.venv|venv|env)/|^old_data/scripts/migrate_rename_model_uns\.py$|^old_data/scripts/usa/build_[a-z]+_topojson\.py$
mypy_path = old_data/scripts/usa
explicit_package_bases = True

plugins = sqlalchemy.ext.mypy.plugin

# Flask's route decorator binds the view function against RouteCallable
# (Callable[..., ResponseReturnValue]); strict mypy mis-reports a [type-var]
# error on every @bp.route view annotated with the broad ResponseReturnValue.
# This is a known Flask + mypy-strict artifact, not a real typing problem.
[mypy-console.blueprints.*]
disable_error_code = type-var

# The US blueprint registers its per-chamber views via bp.add_url_rule, where the
# same stub artifact surfaces as [arg-type] on view_func instead of [type-var].
# (This specific section replaces the glob's option, so type-var is repeated.)
[mypy-console.blueprints.us]
disable_error_code = type-var, arg-type

# Third-party packages without type stubs
[mypy-pypdf.*]
ignore_missing_imports = True

[mypy-geoalchemy2.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-xlrd.*]
ignore_missing_imports = True

[mypy-shapely.*]
ignore_missing_imports = True

[mypy-psycopg2.*]
ignore_missing_imports = True

[mypy-lxml.*]
ignore_missing_imports = True

[mypy-run_uns_model]
ignore_missing_imports = True

[mypy-run_holyrood_uns_model]
ignore_missing_imports = True

# US forecast runners import their shared pipeline by bare module name after a
# sys.path insert (mirrors run_uns_model); silence the unresolved bare imports.
[mypy-_common]
ignore_missing_imports = True

[mypy-run_us_house_model]
ignore_missing_imports = True

[mypy-run_us_presidential_model]
ignore_missing_imports = True

[mypy-run_us_senate_model]
ignore_missing_imports = True

[mypy-export_elections]
ignore_missing_imports = True

[mypy-import_general_elections]
ignore_missing_imports = True

[mypy-scripts.*]
ignore_missing_imports = True

