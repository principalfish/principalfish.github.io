{% extends "base.html" %}
{% block content %}
  <section class="card">
    <h2>Import By-Election</h2>
    <form method="post" action="{{ url_for('by_election_preview') }}" class="form">
      <label for="source_url">Wikipedia By-Election URL</label>
      <input
        type="url"
        id="source_url"
        name="source_url"
        required
        placeholder="https://en.wikipedia.org/wiki/2025_..."
      />

      <label for="parent_election">Parent Election</label>
      <select name="parent_election" id="parent_election" required>
        {% for election in elections %}
          <option value="{{ election.name }}" {{ 'selected' if election.name == default_parent }}>{{ election.name }}</option>
        {% endfor %}
      </select>

      <button type="submit" class="button primary">Preview Import</button>
    </form>
  </section>
{% endblock %}
